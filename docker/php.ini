; Expose container environment variables (DB_HOST=pgsql, ...) to Laravel.
variables_order = EGPCS

; Recordings are uploaded up to 200 MB (InterviewRecordingController).
post_max_size = 256M
upload_max_filesize = 256M
memory_limit = 512M

; The code is bind-mounted from the host, where every file stat is slow
; (especially on Windows). Cache compiled files and resolved paths, and only
; re-check timestamps every 2 seconds.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
